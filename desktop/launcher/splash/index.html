<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>KietStation</title>
    <style>
        html, body { margin: 0; height: 100%; background: #0b0d12; color: #e8eaf0; font-family: "Segoe UI", system-ui, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; user-select: none; }
        .box { text-align: center; max-width: 520px; padding: 24px; }
        img { width: 112px; height: 112px; border-radius: 24px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
        h1 { font-size: 22px; font-weight: 600; margin: 20px 0 6px; }
        p { margin: 0; color: #9aa1b2; font-size: 14px; line-height: 1.5; }
        .spin { width: 28px; height: 28px; margin: 24px auto 0; border: 3px solid #2a2f3b; border-top-color: #8ab4ff; border-radius: 50%; animation: s 0.9s linear infinite; }
        @keyframes s { to { transform: rotate(360deg); } }
        #err { display: none; margin-top: 22px; padding: 14px 16px; border-radius: 12px; background: #2a1517; color: #ffb4b4; font-size: 13px; text-align: left; user-select: text; }
        #err code { display: block; margin-top: 8px; color: #e8eaf0; word-break: break-all; }
    </style>
</head>
<body>
    <div class="box">
        <img src="logo.png" alt="">
        <h1>KietStation</h1>
        <p id="msg">Đang khởi động… Lần mở đầu tiên có thể mất khoảng một phút.</p>
        <div class="spin" id="spin"></div>
        <div id="err"><span id="err-text"></span><code id="err-log"></code></div>
    </div>
    <script>
        window.showError = function (text, logPath) {
            document.getElementById('spin').style.display = 'none';
            document.getElementById('msg').textContent = 'Không mở được KietStation.';
            document.getElementById('err-text').textContent = text + ' Chi tiết lỗi nằm trong file:';
            document.getElementById('err-log').textContent = logPath;
            document.getElementById('err').style.display = 'block';
        };
    </script>
</body>
</html>
